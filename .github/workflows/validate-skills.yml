name: Validate skills

on:
  pull_request:
  push:
    branches:
      - prod
      - "codex/**"

permissions:
  contents: read

concurrency:
  group: validate-skills-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate portable skill structure
        run: python scripts/validate_skills.py

      - name: Test hooks, validator, and local installation
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Test usage monitor
        run: python -m unittest discover -s tools/claude-usage-monitor/tests
